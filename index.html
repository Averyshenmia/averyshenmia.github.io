<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body {
            background-color: #f4f1ea; /* 柔和的纸质米白色 */
            color: #333;
            font-family: 'Georgia', 'Times New Roman', serif; /* 优雅的衬线字体 */
            line-height: 1.8;
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid #dcd3c6;
            padding-bottom: 20px;
        }
        h1 {
            font-weight: normal;
            font-size: 2em;
            letter-spacing: 3px;
            color: #222;
        }
        p.subtitle {
            color: #777;
            font-style: italic;
        }
        .nav {
            margin-top: 30px;
        }
        .nav a {
            color: #555;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9em;
            border-bottom: 1px dashed #aaa;
            padding-bottom: 2px;
        }
        .nav a:hover {
            color: #000;
            border-bottom: 1px solid #000;
        }
        .content {
            text-align: center;
            margin-top: 60px;
            font-size: 1.1em;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>无题空间</h1>
        <p class="subtitle">记录日记与诗歌的角落</p>
        <div class="nav">
            <a href="#">日记 (建设中)</a>
            <a href="#">诗歌 (建设中)</a>
            <a href="/admin/">进入写作后台</a>
        </div>
    </header>

    <div class="content">
        <p>页面前端框架正在搭建中...</p>
        <p>请先点击上方“进入写作后台”记录你的第一篇文字。<br>稍后我们会将后台的文章接入到这里，优雅地展示出来。</p>
    </div>
</body>
</html>
