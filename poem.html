<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19世纪故事集</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background-color: #f4f1ea;
            color: #333;
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .back-home { font-size: 0.9em; color: #666; text-decoration: none; border-bottom: 1px dashed #aaa; }
        h2 { font-weight: normal; font-size: 1.8em; margin-top: 30px; margin-bottom: 30px; border-bottom: 1px solid #dcd3c6; padding-bottom: 15px; }
        .post-list { list-style: none; padding: 0; margin-bottom: 50px; }
        .post-item { margin-bottom: 20px; }
        .post-date { font-size: 0.85em; color: #888; margin-bottom: 2px; }
        .post-title {
            font-size: 1.15em;
            color: #2c3e50;
            cursor: pointer;
            border-bottom: 1px solid #dcd3c6;
            padding-bottom: 2px;
            display: inline-block;
        }
        .post-title:hover { color: #000; border-bottom: 1px solid #000; }
        .post-title.active { color: #000; font-weight: bold; border-bottom: 2px solid #000; }

        .reader-box {
            display: none;
            background: #fff;
            border: 1px solid #dcd3c6;
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 60px;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .nav-btn {
            background: none;
            border: 1px solid #dcd3c6;
            padding: 6px 15px;
            cursor: pointer;
            color: #555;
            font-family: inherit;
            font-size: 0.9em;
        }
        .nav-btn:hover { background: #f4f1ea; color: #000; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← 返回主页</a>

    <!-- 阅读区域 -->
    <div id="reader" class="reader-box">
        <h3 id="read-title" style="font-weight:normal; font-size:1.4em; margin-bottom:25px; border-bottom: 1px solid #eee; padding-bottom: 10px;"></h3>
        <div id="read-content" style="white-space: pre-wrap;"></div>
        <div class="nav-buttons">
            <button id="prev-btn" class="nav-btn" onclick="changeArticle(-1)">← 上一篇</button>
            <button id="next-btn" class="nav-btn" onclick="changeArticle(1)">下一篇 →</button>
        </div>
    </div>

    <h2>十九世纪故事集</h2>
    <div id="poem-list">加载中...</div>

    <script>
        let allArticles = [];
        let currentIndex = -1;

        async function loadPoems() {
            const container = document.getElementById('poem-list');
            try {
                const res = await fetch(`https://api.github.com/repos/averyshenmia/averyshenmia.github.io/contents/content/poem`);
                if (!res.ok) throw new Error();
                const files = await res.json();
                
                if (files.length === 0) {
                    container.innerHTML = "<p style='color:#888;'>暂无作品</p>";
                    return;
                }

                let rawArticles = [];
                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const fileRes = await fetch(file.download_url);
                        const text = await fileRes.text();
                        
                        let title = file.name;
                        let date = "";
                        let weight = 9999;

                        const matchTitle = text.match(/title:\s*["']?(.*?)["']?(\r?\n|$)/);
                        const matchDate = text.match(/date:\s*["']?(.*?)["']?(\r?\n|$)/);
                        const matchWeight = text.match(/weight:\s*([0-9]+)/);
                        
                        if (matchTitle) title = matchTitle[1];
                        if (matchDate) date = matchDate[1].split('T')[0];
                        if (matchWeight) weight = parseInt(matchWeight[1]);

                        let body = text.replace(/---[\s\S]*?---/, '').trim();
                        rawArticles.push({ title, body, date, weight, fileName: file.name });
                    }
                }

                // 核心排序：优先按照后台填写的 weight 从小到大排序
                rawArticles.sort((a, b) => {
                    if (a.weight !== b.weight) {
                        return a.weight - b.weight;
                    }
                    return a.fileName.localeCompare(b.fileName);
                });

                allArticles = rawArticles;
                renderList();
            } catch (e) {
                container.innerHTML = "<p style='color:#888;'>暂无作品</p>";
            }
        }

        function renderList() {
            const container = document.getElementById('poem-list');
            if (allArticles.length === 0) {
                container.innerHTML = "<p style='color:#888;'>暂无作品</p>";
                return;
            }

            let html = "<ul class='post-list'>";
            for (let i = 0; i < allArticles.length; i++) {
                let art = allArticles[i];
                let isActive = (i === currentIndex) ? ' active' : '';
                html += `
                    <li class="post-item">
                        ${art.date ? `<div class="post-date">${art.date}</div>` : ''}
                        <span class="post-title${isActive}" onclick='openArticle(${i})'>${art.title}</span>
                    </li>
                `;
            }
            html += "</ul>";
            container.innerHTML = html;
        }

        function openArticle(index) {
            currentIndex = index;
            let art = allArticles[currentIndex];
            document.getElementById('read-title').innerText = art.title;
            document.getElementById('read-content').innerHTML = marked.parse(art.body);
            
            // 按钮状态控制
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === allArticles.length - 1);

            const reader = document.getElementById('reader');
            reader.style.display = 'block';
            reader.scrollIntoView({ behavior: 'smooth' });

            renderList();
        }

        function changeArticle(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < allArticles.length) {
                openArticle(newIndex);
            }
        }

        loadPoems();
    </script>
</body>
</html>
